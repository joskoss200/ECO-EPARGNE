<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoÉpargne - Banque en Poche & Passerelle Crypto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800">

    <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl flex flex-col justify-between relative overflow-hidden">

        <!-- 1. AUTHENTIFICATION (Connexion / Inscription) -->
        <div id="screen-auth" class="p-6 flex flex-col justify-center min-h-screen">
            <div class="text-center mb-6">
                <div class="w-24 h-24 mx-auto mb-3 flex items-center justify-center bg-blue-50 rounded-3xl shadow-inner">
                    <i class="fa-solid fa-wallet text-4xl text-blue-600"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tight">Eco<span class="text-blue-600">Épargne</span></h1>
                <p class="text-xs text-slate-500 mt-1">Votre banque en poche & Passerelle Crypto-XOF</p>
            </div>

            <!-- Onglets de bascule Connexion / Inscription -->
            <div class="flex bg-slate-100 p-1 rounded-2xl mb-6 shadow-inner">
                <button type="button" onclick="switchAuthTab('login')" id="tab-login" class="flex-1 py-2.5 text-xs font-bold rounded-xl bg-white shadow-sm text-blue-600 transition-all">Connexion</button>
                <button type="button" onclick="switchAuthTab('register')" id="tab-register" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-400 transition-all">Inscription</button>
            </div>

            <!-- FORMULAIRE CONNEXION -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1"><i class="fa-solid fa-phone mr-1 text-blue-600"></i> Téléphone</label>
                    <input type="text" id="login-phone" required placeholder="Ex: 0700000000" class="w-full px-4 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:border-blue-600 transition-all">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1"><i class="fa-solid fa-lock mr-1 text-blue-600"></i> Code PIN (4 chiffres)</label>
                    <input type="password" id="login-pin" maxlength="4" required placeholder="••••" class="w-full px-4 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 text-sm tracking-widest text-center focus:outline-none focus:border-blue-600 transition-all">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-600/30 transition-all active:scale-[0.98]">
                    Se connecter
                </button>
            </form>

            <!-- FORMULAIRE INSCRIPTION (Ouvert et fonctionnel) -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1"><i class="fa-solid fa-user mr-1 text-blue-600"></i> Nom et Prénom</label>
                    <input type="text" id="reg-name" required placeholder="Ex: Jean Kouassi" class="w-full px-4 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:border-blue-600 transition-all">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1"><i class="fa-solid fa-phone mr-1 text-blue-600"></i> Téléphone</label>
                    <input type="text" id="reg-phone" required placeholder="Ex: 0700000000" class="w-full px-4 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:border-blue-600 transition-all">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1"><i class="fa-solid fa-lock mr-1 text-blue-600"></i> Créer un Code PIN (4 chiffres)</label>
                    <input type="password" id="reg-pin" maxlength="4" required placeholder="••••" class="w-full px-4 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 text-sm tracking-widest text-center focus:outline-none focus:border-blue-600 transition-all">
                </div>
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-4 rounded-2xl font-bold shadow-lg transition-all active:scale-[0.98]">
                    Créer mon compte
                </button>
            </form>
        </div>

        <!-- ÉCRAN DASHBOARD -->
        <div id="screen-dashboard" class="hidden flex flex-col h-screen">
            <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
                <div>
                    <p class="text-[10px] text-slate-400 uppercase tracking-wider">Bienvenue,</p>
                    <h2 id="user-display-name" class="font-bold text-sm">Utilisateur</h2>
                </div>
                <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-xl text-red-400 transition-all">
                    <i class="fa-solid fa-power-off"></i> Déconnexion
                </button>
            </div>

            <div class="p-6 bg-gradient-to-br from-blue-600 to-blue-800 text-white m-4 rounded-3xl shadow-xl">
                <p class="text-xs text-blue-100 uppercase font-medium">Solde Disponible</p>
                <h1 id="user-balance" class="text-3xl font-black mt-1">0 XOF</h1>
                <div class="flex gap-2 mt-4">
                    <button onclick="openModal('deposit')" class="flex-1 bg-white/20 hover:bg-white/30 py-2.5 rounded-xl text-xs font-bold transition-all"><i class="fa-solid fa-plus mr-1"></i> Dépôt</button>
                    <button onclick="openModal('withdraw')" class="flex-1 bg-white/20 hover:bg-white/30 py-2.5 rounded-xl text-xs font-bold transition-all"><i class="fa-solid fa-arrow-up mr-1"></i> Retrait</button>
                    <button onclick="openModal('crypto')" class="flex-1 bg-white/20 hover:bg-white/30 py-2.5 rounded-xl text-xs font-bold transition-all"><i class="fa-solid fa-coins mr-1"></i> Crypto</button>
                </div>
            </div>

            <div class="flex px-4 gap-2 mb-3">
                <button onclick="switchTab('home')" id="btn-tab-home" class="flex-1 py-2 bg-blue-50 text-blue-600 rounded-xl text-xs font-bold border border-blue-100 transition-all">Accueil</button>
                <button onclick="switchTab('savings')" id="btn-tab-savings" class="flex-1 py-2 bg-slate-50 text-slate-500 rounded-xl text-xs font-bold border border-slate-100 transition-all">Épargne</button>
                <button onclick="switchTab('history')" id="btn-tab-history" class="flex-1 py-2 bg-slate-50 text-slate-500 rounded-xl text-xs font-bold border border-slate-100 transition-all">Historique</button>
            </div>

            <div class="flex-1 px-4 overflow-y-auto pb-24">
                <div id="tab-content-home" class="space-y-4">
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                        <h4 class="text-xs font-bold text-slate-700 uppercase mb-2"><i class="fa-solid fa-bolt text-amber-500 mr-1"></i> Accès Rapide</h4>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="alert('Fonctionnalité Transfert')" class="p-3 bg-white rounded-xl border border-slate-200 text-left hover:border-blue-500 transition-all">
                                <i class="fa-solid fa-paper-plane text-blue-600 mb-1"></i>
                                <p class="text-xs font-bold text-slate-800">Transférer</p>
                                <p class="text-[10px] text-slate-400">Vers un compte Eco</p>
                            </button>
                            <button onclick="alert('Passerelle Crypto active')" class="p-3 bg-white rounded-xl border border-slate-200 text-left hover:border-blue-500 transition-all">
                                <i class="fa-solid fa-repeat text-emerald-600 mb-1"></i>
                                <p class="text-xs font-bold text-slate-800">Convertir</p>
                                <p class="text-[10px] text-slate-400">Crypto ⇄ XOF</p>
                            </button>
                        </div>
                    </div>
                </div>

                <div id="tab-content-savings" class="space-y-4 hidden">
                    <div class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-4 rounded-2xl shadow-md">
                        <p class="text-[10px] uppercase font-bold text-emerald-200">Coffre-fort d'épargne</p>
                        <h3 class="text-2xl font-black mt-1">0 XOF</h3>
                    </div>
                </div>

                <div id="tab-content-history" class="space-y-3 hidden">
                    <h3 class="text-xs font-bold uppercase text-slate-400 mb-2">Transactions Récentes</h3>
                    <p class="text-xs text-slate-400">Aucune transaction pour le moment.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchAuthTab(tab) {
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');

            if(tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLogin.className = "flex-1 py-2.5 text-xs font-bold rounded-xl bg-white shadow-sm text-blue-600 transition-all";
                tabReg.className = "flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-400 transition-all";
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                tabReg.className = "flex-1 py-2.5 text-xs font-bold rounded-xl bg-white shadow-sm text-blue-600 transition-all";
                tabLogin.className = "flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-400 transition-all";
            }
        }

        function switchTab(tabName) {
            const homeContent = document.getElementById('tab-content-home');
            const savingsContent = document.getElementById('tab-content-savings');
            const historyContent = document.getElementById('tab-content-history');
            
            const btnHome = document.getElementById('btn-tab-home');
            const btnSavings = document.getElementById('btn-tab-savings');
            const btnHistory = document.getElementById('btn-tab-history');

            homeContent.classList.add('hidden');
            savingsContent.classList.add('hidden');
            historyContent.classList.add('hidden');
            
            btnHome.className = "flex-1 py-2 bg-slate-50 text-slate-500 rounded-xl text-xs font-bold border border-slate-100 transition-all";
            btnSavings.className = "flex-1 py-2 bg-slate-50 text-slate-500 rounded-xl text-xs font-bold border border-slate-100 transition-all";
            btnHistory.className = "flex-1 py-2 bg-slate-50 text-slate-500 rounded-xl text-xs font-bold border border-slate-100 transition-all";

            if(tabName === 'home') {
                homeContent.classList.remove('hidden');
                btnHome.className = "flex-1 py-2 bg-blue-50 text-blue-600 rounded-xl text-xs font-bold border border-blue-100 transition-all";
            } else if(tabName === 'savings') {
                savingsContent.classList.remove('hidden');
                btnSavings.className = "flex-1 py-2 bg-blue-50 text-blue-600 rounded-xl text-xs font-bold border border-blue-100 transition-all";
            } else if(tabName === 'history') {
                historyContent.classList.remove('hidden');
                btnHistory.className = "flex-1 py-2 bg-blue-50 text-blue-600 rounded-xl text-xs font-bold border border-blue-100 transition-all";
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const nom = document.getElementById('reg-name').value;
            const téléphone = document.getElementById('reg-phone').value;
            const codePIN = document.getElementById('reg-pin').value;

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nom, téléphone, codePIN })
                });
                const data = await response.json();
                if(response.ok) {
                    alert('Inscription réussie ! Vous pouvez maintenant vous connecter.');
                    switchAuthTab('login');
                } else {
                    alert(data.erreur || 'Erreur lors de l’inscription');
                }
            } catch(err) {
                alert('Erreur de connexion au serveur.');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const téléphone = document.getElementById('login-phone').value;
            const codePIN = document.getElementById('login-pin').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ téléphone, codePIN })
                });
                const data = await response.json();
                
                if(response.ok) {
                    document.getElementById('screen-auth').classList.add('hidden');
                    document.getElementById('screen-dashboard').classList.remove('hidden');
                    document.getElementById('user-display-name').innerText = data.nom;
                } else {
                    alert(data.erreur || 'Identifiants incorrects.');
                }
            } catch(err) {
                alert('Erreur de connexion au serveur.');
            }
        }

        function logout() {
            document.getElementById('screen-dashboard').classList.add('hidden');
            document.getElementById('screen-auth').classList.remove('hidden');
        }

        function openModal(action) {
            if(action === 'deposit') alert('Module Dépôt Mobile Money');
            if(action === 'withdraw') alert('Module Retrait');
            if(action === 'crypto') alert('Passerelle Crypto');
        }
    </script>
</body>
</html>
